name: verify

on:
  # PRs run once here; branch pushes are checked after they land on main.
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: planet-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: planet-api/go.mod
          cache: true
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      - run: go vet ./...
      - name: Run real HTTP V1 walkthrough
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          go run ./cmd/planet-cli migrate up --url "$DATABASE_URL"
          go build -o "$RUNNER_TEMP/planet-api" ./cmd/planet-api
          PLANET_ENV=dev DEV_AUTH_CODES=1 DATABASE_URL="$DATABASE_URL" \
            BIND=127.0.0.1:8081 CORS_ORIGINS=http://localhost:5173 \
            "$RUNNER_TEMP/planet-api" >"$RUNNER_TEMP/planet-api.log" 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:8081/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS --max-time 2 http://127.0.0.1:8081/healthz >/dev/null; then
            cat "$RUNNER_TEMP/planet-api.log"
            exit 1
          fi
          BASE=http://127.0.0.1:8081 bash ../scripts/e2e-v1.sh
          BASE=http://127.0.0.1:8081/api/v1 bash ../scripts/acceptance-care-coordination.sh

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: APP/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The Expo web dev server is shared by the browser projects. Serializing
      # CI workers avoids concurrent hot-reload/navigation races that do not
      # occur in the production bundle and otherwise make the gate flaky.
      - run: npm run test:e2e -- --workers=1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run doctor
      - run: npm run export:web:production
      - name: Install ripgrep for contract checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - run: npm run verify:frontend
      - run: npm audit --omit=dev --audit-level=high
      - run: ../scripts/verify-notification-contract.sh
      - run: ../scripts/verify-client-layers.sh
      - run: ../scripts/verify-extension-layer.sh

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www.joinplanet.pet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www.joinplanet.pet/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: NEXT_TELEMETRY_DISABLED=1 NEXT_PRIVATE_BUILD_WORKER=1 npm test
      - run: npm run lint
