name: deploy backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: planet-api/go.mod
          cache-dependency-path: planet-api/go.sum
          cache: true

      - name: Configure SSH
        env:
          PLANET_SSH_PRIVATE_KEY: ${{ secrets.PLANET_SSH_PRIVATE_KEY }}
          PLANET_SSH_HOST: ${{ secrets.PLANET_SSH_HOST }}
          PLANET_SSH_KNOWN_HOSTS: ${{ secrets.PLANET_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$PLANET_SSH_PRIVATE_KEY"
          test -n "$PLANET_SSH_HOST"
          test -n "$PLANET_SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PLANET_SSH_PRIVATE_KEY" > "$HOME/.ssh/planet-deploy"
          chmod 600 "$HOME/.ssh/planet-deploy"
          printf '%s\n' "$PLANET_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host $PLANET_SSH_HOST
            IdentityFile $HOME/.ssh/planet-deploy
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Inspect remote deployment prerequisites
        env:
          PLANET_SSH_USER: ${{ secrets.PLANET_SSH_USER }}
          PLANET_SSH_HOST: ${{ secrets.PLANET_SSH_HOST }}
        run: |
          test -n "$PLANET_SSH_USER"
          ssh "$PLANET_SSH_USER@$PLANET_SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo "remote_arch=$(uname -m)"
          for path in /etc/planet-api-owner.env /etc/planet-api.env /opt/planet-backend/.env /opt/planet-api/.env; do
            if [ -f "$path" ]; then echo "env_file=$path"; else echo "env_file_missing=$path"; fi
          done
          for service in planet-api planet-backend; do
            if systemctl list-unit-files "$service.service" --no-legend 2>/dev/null | grep -q "$service.service"; then
              echo "service_unit=$service"
              systemctl is-active "$service.service" 2>/dev/null || true
            else
              echo "service_unit_missing=$service"
            fi
          done
          if command -v caddy >/dev/null 2>&1; then echo "caddy=installed"; else echo "caddy=missing"; fi
          if [ -f /opt/planet-backend/.env ]; then
            awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/{print "legacy_env_key=" $1}' /opt/planet-backend/.env | sort
          fi
          REMOTE

      - name: Configure production runtime environment
        env:
          PLANET_SSH_USER: ${{ secrets.PLANET_SSH_USER }}
          PLANET_SSH_HOST: ${{ secrets.PLANET_SSH_HOST }}
          PLANET_APP_DATABASE_URL: ${{ secrets.PLANET_APP_DATABASE_URL }}
          PLANET_OWNER_PASSWORD: ${{ secrets.PLANET_OWNER_PASSWORD }}
          PLANET_RESEND_API_KEY: ${{ secrets.PLANET_RESEND_API_KEY }}
          PLANET_BACKUP_DIR: ${{ secrets.PLANET_BACKUP_DIR }}
          PLANET_BACKUP_S3_URI: ${{ secrets.PLANET_BACKUP_S3_URI }}
        run: |
          missing=()
          for name in PLANET_APP_DATABASE_URL PLANET_OWNER_PASSWORD PLANET_RESEND_API_KEY PLANET_BACKUP_DIR PLANET_BACKUP_S3_URI; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing production deployment secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          ssh "$PLANET_SSH_USER@$PLANET_SSH_HOST" 'bash -s' <<REMOTE
          set -eu
          umask 077
          cat > /etc/planet-api.env <<ENV
          PLANET_ENV=prod
          BIND=127.0.0.1:8081
          DATABASE_URL=$PLANET_APP_DATABASE_URL
          RESEND_API_KEY=$PLANET_RESEND_API_KEY
          MAIL_FROM=PLANET <code@mail.joinplanet.pet>
          BASE_URL=https://api.joinplanet.pet
          LOG_LEVEL=info
          PLANET_SCHEDULER=1
          CORS_ORIGINS=https://www.joinplanet.pet,https://app.joinplanet.pet
          BACKUP_DIR=$PLANET_BACKUP_DIR
          BACKUP_S3_URI=$PLANET_BACKUP_S3_URI
          ENV
          cat > /etc/planet-api-owner.env <<ENV
          PLANET_OWNER_PASSWORD=$PLANET_OWNER_PASSWORD
          ENV
          chown root:root /etc/planet-api.env /etc/planet-api-owner.env
          chmod 600 /etc/planet-api.env /etc/planet-api-owner.env
          REMOTE

      - name: Deploy current backend
        working-directory: planet-api
        env:
          PLANET_SSH_USER: ${{ secrets.PLANET_SSH_USER }}
          PLANET_SSH_HOST: ${{ secrets.PLANET_SSH_HOST }}
        run: |
          test -n "$PLANET_SSH_USER"
          ./deploy/deploy.sh "$PLANET_SSH_USER@$PLANET_SSH_HOST"

      - name: Verify public production entry points
        run: ./scripts/production-smoke.sh
