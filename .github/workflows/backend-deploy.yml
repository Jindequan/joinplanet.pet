name: deploy backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: planet-api/go.mod
          cache: true

      - name: Configure SSH
        env:
          PLANET_SSH_PRIVATE_KEY: ${{ secrets.PLANET_SSH_PRIVATE_KEY }}
          PLANET_SSH_HOST: ${{ secrets.PLANET_SSH_HOST }}
          PLANET_SSH_KNOWN_HOSTS: ${{ secrets.PLANET_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$PLANET_SSH_PRIVATE_KEY"
          test -n "$PLANET_SSH_HOST"
          test -n "$PLANET_SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PLANET_SSH_PRIVATE_KEY" > "$HOME/.ssh/planet-deploy"
          chmod 600 "$HOME/.ssh/planet-deploy"
          printf '%s\n' "$PLANET_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host $PLANET_SSH_HOST
            IdentityFile $HOME/.ssh/planet-deploy
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Inspect remote deployment prerequisites
        env:
          PLANET_SSH_USER: ${{ secrets.PLANET_SSH_USER }}
          PLANET_SSH_HOST: ${{ secrets.PLANET_SSH_HOST }}
        run: |
          test -n "$PLANET_SSH_USER"
          ssh "$PLANET_SSH_USER@$PLANET_SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo "remote_arch=$(uname -m)"
          for path in /etc/planet-api-owner.env /etc/planet-api.env /opt/planet-backend/.env /opt/planet-api/.env; do
            if [ -f "$path" ]; then echo "env_file=$path"; else echo "env_file_missing=$path"; fi
          done
          for service in planet-api planet-backend; do
            if systemctl list-unit-files "$service.service" --no-legend 2>/dev/null | grep -q "$service.service"; then
              echo "service_unit=$service"
              systemctl is-active "$service.service" 2>/dev/null || true
            else
              echo "service_unit_missing=$service"
            fi
          done
          if command -v caddy >/dev/null 2>&1; then echo "caddy=installed"; else echo "caddy=missing"; fi
          REMOTE

      - name: Deploy current backend
        working-directory: planet-api
        env:
          PLANET_SSH_USER: ${{ secrets.PLANET_SSH_USER }}
          PLANET_SSH_HOST: ${{ secrets.PLANET_SSH_HOST }}
        run: |
          test -n "$PLANET_SSH_USER"
          ./deploy/deploy.sh "$PLANET_SSH_USER@$PLANET_SSH_HOST"

      - name: Verify public production entry points
        run: ./scripts/production-smoke.sh
